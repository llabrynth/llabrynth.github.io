<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyFiles</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });
    window.__mermaid = mermaid;
  </script>

  <style>
    :root {
      --bg:       #080a0f;
      --surface:  #0f1117;
      --surface2: #151820;
      --border:   #1c2133;
      --accent:   #4f8ef7;
      --accent2:  #a78bfa;
      --green:    #34d399;
      --danger:   #f87171;
      --amber:    #fbbf24;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --radius:   10px;
      --mono:     'JetBrains Mono','Fira Code',monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI','Noto Sans KR',sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; overflow-x: hidden;
    }
    button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(79,142,247,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,142,247,.03) 1px, transparent 1px);
      background-size: 44px 44px; pointer-events: none; z-index: 0;
    }

    /* ── TOPBAR ── */
    #topbar {
      position: sticky; top: 0; z-index: 200;
      display: flex; align-items: center; gap: 14px;
      padding: 12px 26px;
      background: rgba(8,10,15,.9); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1rem; font-weight: 800; letter-spacing: -.5px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }
    .sep { flex: 1; }
    #search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 12px; transition: border-color .2s;
    }
    #search-box:focus-within { border-color: var(--accent); }
    #search-box input {
      background: none; border: none; outline: none;
      color: var(--text); font-size: .83rem; width: 190px;
    }
    #total-count {
      font-size: .78rem; color: var(--muted);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 12px; white-space: nowrap;
    }
    #total-count span { color: var(--text); font-weight: 700; }

    /* ── MAIN ── */
    #app { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 28px 22px 80px; }

    /* ── FILE TABLE ── */
    #file-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    #file-table thead th {
      padding: 11px 16px;
      font-size: .72rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted);
      text-align: left; border-bottom: 1px solid var(--border);
      background: var(--surface2);
      white-space: nowrap;
    }
    #file-table thead th:last-child { text-align: right; }

    #file-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .12s;
    }
    #file-table tbody tr:last-child { border-bottom: none; }
    #file-table tbody tr:hover { background: rgba(79,142,247,.04); }

    #file-table td { padding: 11px 16px; vertical-align: middle; }

    /* icon cell */
    .td-icon { width: 36px; padding-right: 0 !important; }
    .file-type-icon { font-size: 1.25rem; line-height: 1; display: block; }

    /* name cell */
    .td-name { min-width: 0; }
    .file-name {
      font-size: .88rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 340px;
    }
    .file-name-link { cursor: pointer; }
    .file-name-link:hover { color: var(--accent); }

    /* type badge */
    .td-type { width: 80px; }
    .type-badge {
      display: inline-block; font-size: .67rem; font-weight: 700;
      padding: 2px 8px; border-radius: 99px; font-family: var(--mono);
      letter-spacing: .04em;
    }
    .type-pdf   { background: rgba(248,113,113,.14); color: var(--danger); }
    .type-md    { background: rgba(167,139,250,.14); color: var(--accent2); }
    .type-video { background: rgba(52,211,153,.14);  color: var(--green); }
    .type-other { background: rgba(100,116,139,.12); color: var(--muted); }

    /* size */
    .td-size { width: 90px; font-size: .78rem; color: var(--muted); font-family: var(--mono); white-space: nowrap; }

    /* extra info */
    .td-info { width: 100px; font-size: .78rem; color: var(--muted); white-space: nowrap; }

    /* actions */
    .td-actions { width: 1%; white-space: nowrap; text-align: right; }
    .actions-wrap { display: flex; gap: 5px; justify-content: flex-end; align-items: center; }

    .btn-act {
      font-size: .7rem; font-weight: 600; padding: 4px 11px;
      border-radius: 6px; border: 1px solid var(--border);
      transition: background .14s, border-color .14s, color .14s;
      white-space: nowrap;
    }
    .btn-present { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.3); color: var(--danger); }
    .btn-present:hover { background: rgba(248,113,113,.22); }
    .btn-play    { background: rgba(52,211,153,.1);  border-color: rgba(52,211,153,.3);  color: var(--green); }
    .btn-play:hover { background: rgba(52,211,153,.22); }
    .btn-view    { background: rgba(167,139,250,.1); border-color: rgba(167,139,250,.3); color: var(--accent2); }
    .btn-view:hover { background: rgba(167,139,250,.22); }
    .btn-dl      { background: rgba(251,191,36,.08); border-color: rgba(251,191,36,.25); color: var(--amber); }
    .btn-dl:hover { background: rgba(251,191,36,.2); }
    .btn-del     { background: none; border-color: transparent; color: var(--muted); padding: 4px 7px; font-size: .8rem; }
    .btn-del:hover { color: var(--danger); background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.2); }

    /* empty */
    .row-empty td {
      text-align: center; padding: 56px; color: var(--muted); font-size: .88rem;
    }

    /* ── MD MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 600;
      background: rgba(0,0,0,.72); backdrop-filter: blur(8px);
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    #md-modal .modal-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); width: min(820px,96vw); max-height: 92vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      display: flex; align-items: center; padding: 12px 18px;
      border-bottom: 1px solid var(--border); gap: 10px;
    }
    .modal-header h3 { flex: 1; font-size: .9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal-header button { color: var(--muted); padding: 4px 8px; border-radius: 6px; transition: background .14s; }
    .modal-header button:hover { background: var(--border); color: var(--text); }
    .modal-body { flex: 1; overflow-y: auto; padding: 26px 30px; }
    .md-content h1,.md-content h2,.md-content h3 { margin: 1.2em 0 .5em; font-weight: 700; }
    .md-content h1 { font-size: 1.7rem; border-bottom: 1px solid var(--border); padding-bottom: .35em; }
    .md-content h2 { font-size: 1.2rem; }
    .md-content p  { line-height: 1.78; margin: .7em 0; color: #cbd5e1; }
    .md-content a  { color: var(--accent); }
    .md-content code { font-family: var(--mono); font-size: .82em; background: #1a2030; padding: 2px 6px; border-radius: 4px; }
    .md-content pre { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow-x: auto; margin: 1em 0; }
    .md-content pre code { background: none; padding: 0; }
    .md-content blockquote { border-left: 3px solid var(--accent); padding-left: 16px; color: var(--muted); margin: 1em 0; }
    .md-content ul,.md-content ol { padding-left: 1.5em; margin: .6em 0; line-height: 1.8; }
    .md-content table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    .md-content th,.md-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    .md-content th { background: var(--border); }
    .md-content img { max-width: 100%; border-radius: 8px; }
    .mermaid-wrap { margin: 1em 0; display: flex; justify-content: center; }
    .mermaid-wrap svg { max-width: 100%; border-radius: 8px; background: #0d1117; padding: 16px; }

    /* ── VIDEO MODAL ── */
    #video-modal {
      position: fixed; inset: 0; z-index: 700;
      background: #000; display: none; flex-direction: column;
    }
    #video-modal.open { display: flex; }
    #video-topbar {
      display: flex; align-items: center; gap: 12px; padding: 10px 20px;
      background: rgba(8,10,15,.96); border-bottom: 1px solid #111827; flex-shrink: 0;
    }
    #video-title { flex: 1; font-size: .84rem; font-weight: 600; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vbtn { padding: 5px 13px; border-radius: 8px; font-size: .77rem; font-weight: 600; border: 1px solid var(--border); transition: background .14s; }
    #btn-vfull { background: rgba(79,142,247,.14); border-color: rgba(79,142,247,.3); color: var(--accent); }
    #btn-vfull:hover { background: rgba(79,142,247,.26); }
    #btn-vclose { background: rgba(248,113,113,.12); border-color: rgba(248,113,113,.3); color: var(--danger); }
    #btn-vclose:hover { background: rgba(248,113,113,.24); }
    #video-area { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
    #video-el { max-width: 100%; max-height: 100%; display: block; outline: none; }
    #video-controls {
      display: flex; flex-direction: column; gap: 8px;
      padding: 11px 20px 13px; background: rgba(8,10,15,.97);
      border-top: 1px solid #111827; flex-shrink: 0; user-select: none;
    }
    .progress-row { display: flex; align-items: center; gap: 10px; }
    .time-label { font-size: .71rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 78px; }
    .time-label.right { text-align: right; }
    #progress-track {
      flex: 1; height: 4px; border-radius: 99px; background: #1e2230;
      cursor: pointer; position: relative; transition: height .14s;
    }
    #progress-track:hover { height: 7px; }
    #progress-bar {
      height: 100%; border-radius: 99px; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      pointer-events: none; position: relative;
    }
    #progress-bar::after {
      content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
      width: 11px; height: 11px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity .14s;
    }
    #progress-track:hover #progress-bar::after { opacity: 1; }
    .controls-row { display: flex; align-items: center; gap: 10px; }
    .ctrl-btn {
      width: 32px; height: 32px; border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text); transition: background .14s; flex-shrink: 0;
    }
    .ctrl-btn:hover { background: var(--border); }
    .ctrl-btn.primary {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--accent); color: #fff; transition: background .14s, transform .1s;
    }
    .ctrl-btn.primary:hover { background: #6ba3ff; transform: scale(1.06); }
    .vol-group { display: flex; align-items: center; gap: 6px; }
    #vol-track { width: 68px; height: 4px; border-radius: 99px; background: #1e2230; cursor: pointer; }
    #vol-bar { height: 100%; border-radius: 99px; width: 100%; background: var(--muted); pointer-events: none; }
    .ctrl-sep { flex: 1; }
    .speed-btn {
      font-size: .7rem; font-weight: 700; padding: 3px 8px;
      border-radius: 6px; background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); transition: background .14s, color .14s;
    }
    .speed-btn.active { background: rgba(79,142,247,.18); border-color: rgba(79,142,247,.4); color: var(--accent); }

    /* ── PRESENTER ── */
    #present-modal {
      position: fixed; inset: 0; z-index: 800;
      background: #000; display: none; flex-direction: column;
    }
    #present-modal.open { display: flex; }
    #present-toolbar {
      display: flex; align-items: center; gap: 10px; padding: 10px 18px;
      background: rgba(8,10,15,.96); border-bottom: 1px solid #111827; flex-shrink: 0;
    }
    #present-title { flex: 1; font-size: .84rem; font-weight: 600; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #present-page-info { font-size: .78rem; color: var(--muted); min-width: 68px; text-align: center; }
    #btn-prev, #btn-next {
      padding: 5px 11px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; font-size: .95rem; transition: background .14s;
    }
    #btn-prev:hover, #btn-next:hover { background: var(--border); }
    #btn-prev:disabled, #btn-next:disabled { opacity: .3; cursor: not-allowed; }
    .pbtn { padding: 5px 13px; border-radius: 8px; font-size: .77rem; font-weight: 600; border: 1px solid var(--border); transition: background .14s; }
    #btn-fullscreen-toggle { background: rgba(79,142,247,.12); border-color: rgba(79,142,247,.3); color: var(--accent); }
    #btn-fullscreen-toggle:hover { background: rgba(79,142,247,.24); }
    #btn-close-present { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.3); color: var(--danger); }
    #btn-close-present:hover { background: rgba(248,113,113,.22); }
    .kbd-hint { font-size: .66rem; color: var(--muted); background: var(--border); padding: 2px 6px; border-radius: 4px; font-family: var(--mono); }
    #slide-area { flex: 1; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; }
    #slide-canvas-wrapper { position: relative; box-shadow: 0 0 80px rgba(0,0,0,.9); }
    #slide-canvas { display: block; }
    #slide-loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.7); font-size: .88rem; color: var(--muted); gap: 10px;
    }
    #thumb-strip {
      display: flex; gap: 8px; padding: 8px 14px; overflow-x: auto;
      background: rgba(8,10,15,.96); border-top: 1px solid #111827; flex-shrink: 0;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .thumb-item {
      flex-shrink: 0; width: 74px; height: 52px; border-radius: 5px;
      overflow: hidden; cursor: pointer; border: 2px solid transparent;
      transition: border-color .14s; background: #1a1f2e;
    }
    .thumb-item.active { border-color: var(--accent); }
    .thumb-item canvas { width: 100%; height: 100%; object-fit: cover; }

    /* spinner */
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- ── TOPBAR ── -->
<div id="topbar">
  <span class="logo">☁ MyFiles</span>
  <div class="sep"></div>
  <div id="search-box">
    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search-input" placeholder="파일 검색…" />
  </div>
  <div id="total-count"><span id="count-num">0</span>개 파일</div>
</div>

<!-- ── MAIN ── -->
<div id="app">
  <table id="file-table">
    <thead>
      <tr>
        <th class="td-icon"></th>
        <th>파일명</th>
        <th class="td-type">형식</th>
        <th class="td-size">크기</th>
        <th class="td-info">정보</th>
        <th class="td-actions">작업</th>
      </tr>
    </thead>
    <tbody id="file-tbody">
      <tr class="row-empty"><td colspan="6">파일이 없습니다</td></tr>
    </tbody>
  </table>
</div>

<!-- ── MD VIEWER ── -->
<div class="modal-overlay" id="md-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span>📝</span>
      <h3 id="md-modal-title"></h3>
      <button id="btn-close-md">✕</button>
    </div>
    <div class="modal-body">
      <div class="md-content" id="md-content"></div>
    </div>
  </div>
</div>

<!-- ── VIDEO PLAYER ── -->
<div id="video-modal">
  <div id="video-topbar">
    <span>🎬</span>
    <span id="video-title"></span>
    <div class="sep"></div>
    <button class="vbtn" id="btn-vfull">⛶ 전체화면</button>
    <button class="vbtn" id="btn-vclose">✕ 닫기</button>
  </div>
  <div id="video-area">
    <video id="video-el" preload="metadata"></video>
  </div>
  <div id="video-controls">
    <div class="progress-row">
      <span class="time-label" id="time-current">0:00</span>
      <div id="progress-track"><div id="progress-bar"></div></div>
      <span class="time-label right" id="time-total">0:00</span>
    </div>
    <div class="controls-row">
      <button class="ctrl-btn" id="btn-rew">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
      </button>
      <button class="ctrl-btn primary" id="btn-play-pause">
        <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-fwd">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-3.5"/></svg>
      </button>
      <div class="vol-group">
        <button class="ctrl-btn" id="btn-mute">
          <svg id="icon-vol" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <svg id="icon-mute" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>
        <div id="vol-track"><div id="vol-bar"></div></div>
      </div>
      <div class="ctrl-sep"></div>
      <span style="font-size:.68rem;color:var(--muted)">속도</span>
      <button class="speed-btn" data-speed="0.5">0.5×</button>
      <button class="speed-btn active" data-speed="1">1×</button>
      <button class="speed-btn" data-speed="1.5">1.5×</button>
      <button class="speed-btn" data-speed="2">2×</button>
      <button class="ctrl-btn" id="btn-vfull2">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ── PRESENTER ── -->
<div id="present-modal">
  <div id="present-toolbar">
    <span id="present-title"></span>
    <button id="btn-prev">◀</button>
    <span id="present-page-info">1 / 1</span>
    <button id="btn-next">▶</button>
    <span class="kbd-hint">← →</span>
    <button class="pbtn" id="btn-fullscreen-toggle">⛶ 전체화면</button>
    <button class="pbtn" id="btn-close-present">✕ 닫기</button>
  </div>
  <div id="slide-area">
    <div id="slide-canvas-wrapper">
      <canvas id="slide-canvas"></canvas>
      <div id="slide-loading"><div class="spinner"></div><span>렌더링 중…</span></div>
    </div>
  </div>
  <div id="thumb-strip"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── 파일 레지스트리 ──────────────────────────────────────
// files.json 이 있으면 자동 로드, 없으면 빈 목록
const FILES = []; // { name, path, size, type, extra }
// type: 'pdf' | 'video' | 'md' | 'other'

// ── 파일 목록 정의 ───────────────────────────────────────
// ★ GitHub Pages 배포 시 이 배열에 파일을 직접 추가하세요
// 예시:
// { name: 'slide.pdf',  path: 'files/slide.pdf',  size: 2048000, type: 'pdf'   },
// { name: 'intro.mp4',  path: 'files/intro.mp4',  size: 15000000, type: 'video' },
// { name: 'readme.md',  path: 'files/readme.md',  size: 4096,    type: 'md'    },
// { name: 'data.zip',   path: 'files/data.zip',   size: 500000,  type: 'other' },

// ── 런타임 상태 ─────────────────────────────────────────
const state = {
  files: [],      // 로드된 파일 (FILES 복사본 + 런타임 extra)
  filtered: [],
  pdfDoc: null, currentPage: 1, totalPages: 0,
};

// ── DOM refs ────────────────────────────────────────────
const tbody        = document.getElementById('file-tbody');
const searchInput  = document.getElementById('search-input');
const countNum     = document.getElementById('count-num');
const mdModal      = document.getElementById('md-modal');
const mdModalTitle = document.getElementById('md-modal-title');
const mdContent    = document.getElementById('md-content');
const videoModal   = document.getElementById('video-modal');
const videoTitle   = document.getElementById('video-title');
const videoEl      = document.getElementById('video-el');
const progressBar  = document.getElementById('progress-bar');
const progressTrack= document.getElementById('progress-track');
const timeCurrent  = document.getElementById('time-current');
const timeTotal    = document.getElementById('time-total');
const volBar       = document.getElementById('vol-bar');
const volTrack     = document.getElementById('vol-track');
const iconPlay     = document.getElementById('icon-play');
const iconPause    = document.getElementById('icon-pause');
const iconVol      = document.getElementById('icon-vol');
const iconMute     = document.getElementById('icon-mute');
const presentModal = document.getElementById('present-modal');
const presentTitle = document.getElementById('present-title');
const presentPageInfo = document.getElementById('present-page-info');
const slideCanvas  = document.getElementById('slide-canvas');
const slideLoading = document.getElementById('slide-loading');
const thumbStrip   = document.getElementById('thumb-strip');
const btnPrev      = document.getElementById('btn-prev');
const btnNext      = document.getElementById('btn-next');
const btnFull      = document.getElementById('btn-fullscreen-toggle');

// ── Helpers ─────────────────────────────────────────────
function fmt(b) {
  if (!b) return '—';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}
function fmtTime(s) {
  if (isNaN(s)||!isFinite(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m + ':' + String(sec).padStart(2,'0');
}
function fileIcon(type, name) {
  if (type === 'pdf')   return '📄';
  if (type === 'video') return '🎬';
  if (type === 'md')    return '📝';
  const ext = name.split('.').pop().toLowerCase();
  const map = { zip:'🗜', gz:'🗜', tar:'🗜', rar:'🗜', png:'🖼', jpg:'🖼', jpeg:'🖼', gif:'🖼', svg:'🖼', webp:'🖼', psd:'🖼', ai:'🖼', xls:'📊', xlsx:'📊', csv:'📊', doc:'📃', docx:'📃', ppt:'📌', pptx:'📌', txt:'📋', json:'🔧', xml:'🔧', yaml:'🔧', yml:'🔧', js:'💻', ts:'💻', py:'💻', html:'💻', css:'💻', sh:'⚙️', exe:'⚙️', dmg:'⚙️', pkg:'⚙️' };
  return map[ext] || '📁';
}
function typeBadge(type, name) {
  if (type === 'pdf')   return `<span class="type-badge type-pdf">PDF</span>`;
  if (type === 'video') return `<span class="type-badge type-video">${name.split('.').pop().toUpperCase()}</span>`;
  if (type === 'md')    return `<span class="type-badge type-md">MD</span>`;
  const ext = name.split('.').pop().toUpperCase();
  return `<span class="type-badge type-other">${ext}</span>`;
}
function typeFromName(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (ext === 'pdf') return 'pdf';
  if (['mp4','webm','mov','avi','mkv'].includes(ext)) return 'video';
  if (['md','markdown'].includes(ext)) return 'md';
  return 'other';
}

// ── marked config ────────────────────────────────────────
const renderer = new marked.Renderer();
renderer.code = (code, lang) => {
  const language = lang && hljs.getLanguage(lang) ? lang : null;
  const highlighted = language
    ? hljs.highlight(code, { language }).value
    : hljs.highlightAuto(code).value;
  return `<pre><code class="hljs${language ? ' language-'+language : ''}">${highlighted}</code></pre>`;
};
marked.use({ renderer, breaks: true, gfm: true });

// ── 초기 로드 ────────────────────────────────────────────
async function init() {
  // 1) FILES 배열로 시작
  state.files = FILES.map(f => ({ ...f, type: f.type || typeFromName(f.name) }));

  // 2) files.json 이 있으면 병합
  try {
    const res = await fetch('files.json');
    if (res.ok) {
      const list = await res.json();
      for (const f of list) {
        if (!state.files.find(x => x.name === f.name)) {
          state.files.push({ ...f, type: f.type || typeFromName(f.name) });
        }
      }
    }
  } catch(e) { /* files.json 없으면 무시 */ }

  render();
}

// ── 검색 ────────────────────────────────────────────────
searchInput.addEventListener('input', render);

// ── Render ───────────────────────────────────────────────
function render() {
  const q = searchInput.value.toLowerCase();
  state.filtered = state.files.filter(f => f.name.toLowerCase().includes(q));
  countNum.textContent = state.filtered.length;

  tbody.innerHTML = '';
  if (state.filtered.length === 0) {
    tbody.innerHTML = `<tr class="row-empty"><td colspan="6">${state.files.length === 0 ? '파일이 없습니다 — files.json 을 추가하거나 FILES 배열을 편집하세요' : '검색 결과가 없습니다'}</td></tr>`;
    return;
  }

  for (const f of state.filtered) {
    const tr = document.createElement('tr');

    // extra info column
    let info = '—';
    if (f.extra) info = f.extra;

    // actions
    let actions = '';
    if (f.type === 'pdf') {
      actions = `<button class="btn-act btn-present" data-action="present">▶ 발표</button>
                 <button class="btn-act btn-dl"      data-action="dl">⬇ 저장</button>`;
    } else if (f.type === 'video') {
      actions = `<button class="btn-act btn-play"    data-action="play">▶ 재생</button>
                 <button class="btn-act btn-dl"      data-action="dl">⬇ 저장</button>`;
    } else if (f.type === 'md') {
      actions = `<button class="btn-act btn-view"    data-action="view">👁 열기</button>
                 <button class="btn-act btn-dl"      data-action="dl">⬇ 저장</button>`;
    } else {
      actions = `<button class="btn-act btn-dl"      data-action="dl">⬇ 저장</button>`;
    }

    tr.innerHTML = `
      <td class="td-icon"><span class="file-type-icon">${fileIcon(f.type, f.name)}</span></td>
      <td class="td-name"><div class="file-name file-name-link" data-action="default" title="${f.name}">${f.name}</div></td>
      <td class="td-type">${typeBadge(f.type, f.name)}</td>
      <td class="td-size">${fmt(f.size)}</td>
      <td class="td-info">${info}</td>
      <td class="td-actions"><div class="actions-wrap">${actions}<button class="btn-act btn-del" data-action="del" title="목록에서 제거">✕</button></div></td>
    `;

    // event delegation
    tr.addEventListener('click', e => {
      const action = e.target.closest('[data-action]')?.dataset.action;
      if (!action) return;
      if (action === 'present' || action === 'default' && f.type === 'pdf') openPresenter(f);
      else if (action === 'play'    || action === 'default' && f.type === 'video') openVideo(f);
      else if (action === 'view'    || action === 'default' && f.type === 'md')    openMd(f);
      else if (action === 'dl'      || action === 'default' && f.type === 'other') downloadFile(f);
      else if (action === 'del') { state.files = state.files.filter(x => x !== f); render(); }
    });

    tbody.appendChild(tr);
  }
}

// ── Download ─────────────────────────────────────────────
function downloadFile(f) {
  const a = document.createElement('a');
  a.href = f.objectUrl || f.path || f.name;
  a.download = f.name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ── MD Viewer ────────────────────────────────────────────
async function openMd(f) {
  mdModalTitle.textContent = f.name;
  let text = f.content;
  if (!text) {
    const res = await fetch(f.objectUrl || f.path);
    text = await res.text();
    f.content = text;
  }
  mdContent.innerHTML = marked.parse(text);

  // mermaid 블록 렌더링
  const mermaid = window.__mermaid;
  if (mermaid) {
    mdContent.querySelectorAll('pre code.language-mermaid').forEach((el, i) => {
      const code = el.textContent;
      const wrapper = document.createElement('div');
      wrapper.className = 'mermaid-wrap';
      el.closest('pre').replaceWith(wrapper);
      mermaid.render('mermaid-' + Date.now() + '-' + i, code).then(({ svg }) => {
        wrapper.innerHTML = svg;
      }).catch(err => {
        wrapper.innerHTML = '<pre style="color:var(--danger);font-size:.8rem">' + err + '</pre>';
      });
    });
  }

  mdModal.classList.add('open');
}
document.getElementById('btn-close-md').addEventListener('click', () => mdModal.classList.remove('open'));
mdModal.addEventListener('click', e => { if (e.target === mdModal) mdModal.classList.remove('open'); });

// ── Video Player ─────────────────────────────────────────
async function openVideo(f) {
  videoTitle.textContent = f.name;
  videoEl.src = f.objectUrl || f.path;
  videoModal.classList.add('open');
  document.body.style.overflow = 'hidden';
  videoEl.play().catch(()=>{});
}
function closeVideo() {
  videoEl.pause(); videoEl.src = '';
  videoModal.classList.remove('open');
  document.body.style.overflow = '';
  if (document.fullscreenElement) document.exitFullscreen();
}
document.getElementById('btn-vclose').addEventListener('click', closeVideo);
document.getElementById('btn-play-pause').addEventListener('click', () => { if (videoEl.paused) videoEl.play(); else videoEl.pause(); });
videoEl.addEventListener('play',  () => { iconPlay.style.display='none'; iconPause.style.display=''; });
videoEl.addEventListener('pause', () => { iconPlay.style.display=''; iconPause.style.display='none'; });
videoEl.addEventListener('timeupdate', () => {
  if (!videoEl.duration) return;
  progressBar.style.width = (videoEl.currentTime/videoEl.duration*100) + '%';
  timeCurrent.textContent = fmtTime(videoEl.currentTime);
});
videoEl.addEventListener('loadedmetadata', () => { timeTotal.textContent = fmtTime(videoEl.duration); });
function doSeek(clientX) {
  const rect = progressTrack.getBoundingClientRect();
  videoEl.currentTime = Math.max(0,Math.min(1,(clientX-rect.left)/rect.width)) * (videoEl.duration||0);
}
let seekDrag = false;
progressTrack.addEventListener('mousedown', e => { seekDrag=true; doSeek(e.clientX); });
document.addEventListener('mousemove', e => { if (seekDrag) doSeek(e.clientX); });
document.addEventListener('mouseup', () => { seekDrag=false; });
progressTrack.addEventListener('touchstart', e => { e.preventDefault(); doSeek(e.touches[0].clientX); }, {passive:false});
progressTrack.addEventListener('touchmove',  e => { e.preventDefault(); doSeek(e.touches[0].clientX); }, {passive:false});
document.getElementById('btn-rew').addEventListener('click', () => { videoEl.currentTime = Math.max(0, videoEl.currentTime-10); });
document.getElementById('btn-fwd').addEventListener('click', () => { videoEl.currentTime = Math.min(videoEl.duration||0, videoEl.currentTime+10); });
function updateVolUI(vol) {
  volBar.style.width = (vol*100)+'%';
  iconVol.style.display  = vol===0 ? 'none' : '';
  iconMute.style.display = vol===0 ? '' : 'none';
}
volTrack.addEventListener('click', e => {
  const rect = volTrack.getBoundingClientRect();
  const vol = Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
  videoEl.volume=vol; videoEl.muted=(vol===0); updateVolUI(vol);
});
document.getElementById('btn-mute').addEventListener('click', () => {
  videoEl.muted=!videoEl.muted; updateVolUI(videoEl.muted?0:videoEl.volume);
});
videoEl.addEventListener('volumechange', () => updateVolUI(videoEl.muted?0:videoEl.volume));
updateVolUI(1);
document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); videoEl.playbackRate=parseFloat(btn.dataset.speed);
  });
});
function toggleVideoFull() {
  if (!document.fullscreenElement) { videoModal.requestFullscreen(); document.getElementById('btn-vfull').textContent='⛶ 전체화면 해제'; }
  else { document.exitFullscreen(); document.getElementById('btn-vfull').textContent='⛶ 전체화면'; }
}
document.getElementById('btn-vfull').addEventListener('click', toggleVideoFull);
document.getElementById('btn-vfull2').addEventListener('click', toggleVideoFull);

// ── Presenter ────────────────────────────────────────────
async function openPresenter(f) {
  let doc = f._pdfDoc;
  if (!doc) {
    const url = f.objectUrl || f.path;
    doc = await pdfjsLib.getDocument(url).promise;
    f._pdfDoc = doc;
  }
  state.pdfDoc = doc;
  state.totalPages = doc.numPages;
  state.currentPage = 1;
  presentTitle.textContent = f.name;
  presentModal.classList.add('open');
  document.body.style.overflow = 'hidden';
  await buildThumbs();
  await renderSlide(1);
}
async function buildThumbs() {
  thumbStrip.innerHTML = '';
  for (let i=1; i<=state.totalPages; i++) {
    const item = document.createElement('div');
    item.className='thumb-item'; item.dataset.page=i;
    const c = document.createElement('canvas');
    item.appendChild(c); thumbStrip.appendChild(item);
    (async (pg,canvas,el) => {
      const page = await state.pdfDoc.getPage(pg);
      const vp = page.getViewport({scale:.2});
      canvas.width=vp.width; canvas.height=vp.height;
      await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
      el.addEventListener('click',()=>gotoPage(pg));
    })(i,c,item);
  }
}
async function renderSlide(n) {
  slideLoading.style.display='flex';
  state.currentPage=n;
  presentPageInfo.textContent=`${n} / ${state.totalPages}`;
  btnPrev.disabled=n<=1; btnNext.disabled=n>=state.totalPages;
  thumbStrip.querySelectorAll('.thumb-item').forEach(el=>el.classList.toggle('active',Number(el.dataset.page)===n));
  const active = thumbStrip.querySelector('.thumb-item.active');
  if (active) active.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  const page = await state.pdfDoc.getPage(n);
  const area = document.getElementById('slide-area');
  const vp0 = page.getViewport({scale:1});
  const scale = Math.min((area.clientWidth-40)/vp0.width,(area.clientHeight-40)/vp0.height,2);
  const vp = page.getViewport({scale});
  slideCanvas.width=vp.width; slideCanvas.height=vp.height;
  await page.render({canvasContext:slideCanvas.getContext('2d'),viewport:vp}).promise;
  slideLoading.style.display='none';
}
function gotoPage(n) { if(n>=1&&n<=state.totalPages) renderSlide(n); }
btnPrev.addEventListener('click',()=>gotoPage(state.currentPage-1));
btnNext.addEventListener('click',()=>gotoPage(state.currentPage+1));
document.getElementById('btn-close-present').addEventListener('click',()=>{
  presentModal.classList.remove('open');
  document.body.style.overflow='';
  if(document.fullscreenElement) document.exitFullscreen();
});
btnFull.addEventListener('click',()=>{
  if(!document.fullscreenElement){presentModal.requestFullscreen();btnFull.textContent='⛶ 전체화면 해제';}
  else{document.exitFullscreen();btnFull.textContent='⛶ 전체화면';}
});
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement) btnFull.textContent='⛶ 전체화면';
  if(state.pdfDoc&&presentModal.classList.contains('open')) setTimeout(()=>renderSlide(state.currentPage),100);
});
window.addEventListener('resize',()=>{ if(state.pdfDoc&&presentModal.classList.contains('open')) renderSlide(state.currentPage); });

// ── 키보드 ───────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (presentModal.classList.contains('open')) {
    if([' ','ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();gotoPage(state.currentPage+1);}
    else if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();gotoPage(state.currentPage-1);}
    else if(e.key==='Escape') document.getElementById('btn-close-present').click();
    else if(e.key==='f'||e.key==='F') btnFull.click();
  } else if (videoModal.classList.contains('open')) {
    if(e.key===' '){e.preventDefault();if(videoEl.paused)videoEl.play();else videoEl.pause();}
    else if(e.key==='ArrowRight'){e.preventDefault();videoEl.currentTime=Math.min(videoEl.duration||0,videoEl.currentTime+5);}
    else if(e.key==='ArrowLeft'){e.preventDefault();videoEl.currentTime=Math.max(0,videoEl.currentTime-5);}
    else if(e.key==='ArrowUp'){e.preventDefault();videoEl.volume=Math.min(1,videoEl.volume+.1);updateVolUI(videoEl.volume);}
    else if(e.key==='ArrowDown'){e.preventDefault();videoEl.volume=Math.max(0,videoEl.volume-.1);updateVolUI(videoEl.volume);}
    else if(e.key==='m'||e.key==='M'){videoEl.muted=!videoEl.muted;updateVolUI(videoEl.muted?0:videoEl.volume);}
    else if(e.key==='f'||e.key==='F') toggleVideoFull();
    else if(e.key==='Escape') closeVideo();
  }
});

// ── 슬라이드 스와이프 ───────────────────────────────────
let pTouchX=0;
document.getElementById('slide-area').addEventListener('touchstart',e=>{pTouchX=e.touches[0].clientX;},{passive:true});
document.getElementById('slide-area').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-pTouchX;
  if(Math.abs(dx)>50){dx<0?gotoPage(state.currentPage+1):gotoPage(state.currentPage-1);}
});

init();
</script>
</body>
</html>
