<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>RTwP RPG 아키텍처</title>
</head>
<body>
  <h2>RTwP 전투 루프</h2>
  <pre class="mermaid">
flowchart TD
    Start([Update 매 프레임]) --> CQ[1. CommandQueue 처리]
    CQ --> Check{IsPaused false?}
    Check -->|Yes| Acc[accumulator += dt]
    Check -->|No| Interp[Interpolate 보간]
  </pre>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });
  </script>
</body>
</html>
