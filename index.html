<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyFiles</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Marked (Markdown) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <!-- highlight.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg:        #080a0f;
      --surface:   #0f1117;
      --surface2:  #161a24;
      --border:    #1c2133;
      --accent:    #4f8ef7;
      --accent2:   #a78bfa;
      --green:     #34d399;
      --danger:    #f87171;
      --amber:     #fbbf24;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --radius:    12px;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(79,142,247,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,142,247,.035) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none; z-index: 0;
    }

    /* ── TOPBAR ── */
    #topbar {
      position: sticky; top: 0; z-index: 200;
      display: flex; align-items: center; gap: 14px;
      padding: 13px 28px;
      background: rgba(8,10,15,.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.05rem; font-weight: 800; letter-spacing: -.5px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }
    .sep { flex: 1; }
    #search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 12px;
      transition: border-color .2s;
    }
    #search-box:focus-within { border-color: var(--accent); }
    #search-box input {
      background: none; border: none; outline: none;
      color: var(--text); font-size: .84rem; width: 180px;
    }
    #search-box svg { color: var(--muted); flex-shrink: 0; }
    .view-toggle {
      display: flex; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .view-toggle button { padding: 6px 10px; color: var(--muted); transition: background .15s, color .15s; }
    .view-toggle button.active { background: var(--accent); color: #fff; }

    /* ── MAIN ── */
    #app { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 34px 22px 80px; }

    /* ── DROP ZONE ── */
    #drop-zone {
      border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 36px 40px; text-align: center; margin-bottom: 32px;
      transition: border-color .2s, background .2s; cursor: pointer; position: relative;
    }
    #drop-zone.drag-over { border-color: var(--accent); background: rgba(79,142,247,.05); }
    #drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    #drop-zone .dz-icon { font-size: 2.4rem; margin-bottom: 8px; }
    #drop-zone p { color: var(--muted); font-size: .88rem; }
    #drop-zone strong { color: var(--text); }

    /* ── SECTION HEADER ── */
    .section-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .section-hdr h2 {
      font-size: .88rem; font-weight: 700; color: var(--muted);
      letter-spacing: .1em; text-transform: uppercase;
    }
    .badge {
      font-size: .68rem; padding: 2px 8px; border-radius: 99px; font-weight: 700;
    }
    .badge-pdf  { background: rgba(248,113,113,.14); color: var(--danger); }
    .badge-md   { background: rgba(167,139,250,.14); color: var(--accent2); }
    .badge-mp4  { background: rgba(52,211,153,.14);  color: var(--green); }

    /* ── FILE GRID ── */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px; margin-bottom: 36px;
    }
    .file-grid.list-view { grid-template-columns: 1fr; gap: 7px; }

    /* card */
    .file-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 16px 14px;
      cursor: pointer;
      transition: transform .15s, border-color .2s, box-shadow .2s;
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; gap: 9px;
    }
    .file-card::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      opacity: 0; transition: opacity .2s;
    }
    .file-card.pdf-card::after  { background: linear-gradient(90deg, var(--danger), #fb923c); }
    .file-card.md-card::after   { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .file-card.mp4-card::after  { background: linear-gradient(90deg, var(--green), #06b6d4); }
    .file-card:hover { transform: translateY(-3px); border-color: rgba(79,142,247,.35); box-shadow: 0 10px 36px rgba(0,0,0,.4); }
    .file-card:hover::after { opacity: 1; }

    /* list-mode */
    .list-view .file-card { flex-direction: row; align-items: center; padding: 11px 16px; gap: 12px; }
    .list-view .file-card .file-icon { font-size: 1.4rem; flex-shrink: 0; }
    .list-view .file-card .file-info { flex: 1; min-width: 0; }
    .list-view .file-card .file-thumb { display: none !important; }
    .list-view .file-card .file-actions { flex-shrink: 0; }

    .file-icon { font-size: 2rem; }
    .file-thumb {
      width: 100%; height: 108px; border-radius: 7px;
      background: var(--border); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; color: var(--muted); position: relative;
    }
    .file-thumb img, .file-thumb canvas { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
    .video-play-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.35);
      transition: background .2s;
    }
    .file-card:hover .video-play-overlay { background: rgba(0,0,0,.5); }
    .play-circle {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,.9);
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s;
    }
    .file-card:hover .play-circle { transform: scale(1.1); }
    .play-circle svg { margin-left: 3px; }

    .file-name { font-size: .86rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-meta { font-size: .73rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .file-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .btn-sm {
      font-size: .71rem; padding: 4px 10px; border-radius: 6px;
      border: 1px solid var(--border); transition: background .15s, border-color .15s;
      white-space: nowrap;
    }
    .btn-present { background: rgba(248,113,113,.12); border-color: rgba(248,113,113,.35); color: var(--danger); }
    .btn-present:hover { background: rgba(248,113,113,.25); }
    .btn-play { background: rgba(52,211,153,.12); border-color: rgba(52,211,153,.35); color: var(--green); }
    .btn-play:hover { background: rgba(52,211,153,.25); }
    .btn-view { background: rgba(167,139,250,.1); border-color: rgba(167,139,250,.3); color: var(--accent2); }
    .btn-view:hover { background: rgba(167,139,250,.22); }
    .btn-delete { background: rgba(100,116,139,.08); border-color: rgba(100,116,139,.2); color: var(--muted); }
    .btn-delete:hover { background: rgba(248,113,113,.15); border-color: rgba(248,113,113,.3); color: var(--danger); }

    .empty-state { text-align: center; padding: 36px; color: var(--muted); font-size: .88rem; grid-column: 1/-1; }

    /* ── MD MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 600;
      background: rgba(0,0,0,.72); backdrop-filter: blur(8px);
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    #md-modal .modal-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); width: min(820px, 96vw); max-height: 92vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      display: flex; align-items: center; padding: 13px 18px;
      border-bottom: 1px solid var(--border); gap: 10px;
    }
    .modal-header h3 { flex: 1; font-size: .92rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal-header button { color: var(--muted); padding: 4px 8px; border-radius: 6px; transition: background .15s; font-size: .9rem; }
    .modal-header button:hover { background: var(--border); color: var(--text); }
    .modal-body { flex: 1; overflow-y: auto; padding: 28px 32px; }
    .md-content h1,.md-content h2,.md-content h3 { margin: 1.2em 0 .5em; font-weight: 700; }
    .md-content h1 { font-size: 1.75rem; border-bottom: 1px solid var(--border); padding-bottom: .4em; }
    .md-content h2 { font-size: 1.25rem; }
    .md-content p  { line-height: 1.78; margin: .7em 0; color: #cbd5e1; }
    .md-content a  { color: var(--accent); }
    .md-content code { font-family: var(--font-mono); font-size: .82em; background: #1a2030; padding: 2px 6px; border-radius: 4px; }
    .md-content pre { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow-x: auto; margin: 1em 0; }
    .md-content pre code { background: none; padding: 0; }
    .md-content blockquote { border-left: 3px solid var(--accent); padding-left: 16px; color: var(--muted); margin: 1em 0; }
    .md-content ul,.md-content ol { padding-left: 1.5em; margin: .6em 0; line-height: 1.8; }
    .md-content table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    .md-content th,.md-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    .md-content th { background: var(--border); }
    .md-content img { max-width: 100%; border-radius: 8px; }

    /* ── VIDEO PLAYER MODAL ── */
    #video-modal {
      position: fixed; inset: 0; z-index: 700;
      background: #000;
      display: none; flex-direction: column;
    }
    #video-modal.open { display: flex; }

    #video-topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 20px;
      background: rgba(8,10,15,.96);
      border-bottom: 1px solid #111827;
      flex-shrink: 0;
    }
    #video-title { flex: 1; font-size: .84rem; font-weight: 600; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vbtn {
      padding: 5px 13px; border-radius: 8px; font-size: .77rem; font-weight: 600;
      border: 1px solid var(--border); transition: background .15s;
    }
    #btn-vfull { background: rgba(79,142,247,.15); border-color: rgba(79,142,247,.3); color: var(--accent); }
    #btn-vfull:hover { background: rgba(79,142,247,.28); }
    #btn-vclose { background: rgba(248,113,113,.12); border-color: rgba(248,113,113,.3); color: var(--danger); }
    #btn-vclose:hover { background: rgba(248,113,113,.25); }

    /* video area */
    #video-area {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #000; overflow: hidden; position: relative;
    }
    #video-el {
      max-width: 100%; max-height: 100%;
      display: block;
      outline: none;
    }

    /* custom controls bar */
    #video-controls {
      display: flex; flex-direction: column; gap: 8px;
      padding: 12px 20px 14px;
      background: rgba(8,10,15,.97);
      border-top: 1px solid #111827;
      flex-shrink: 0;
      user-select: none;
    }

    /* progress bar */
    .progress-row { display: flex; align-items: center; gap: 10px; }
    .time-label { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 82px; }
    .time-label.right { text-align: right; }
    #progress-track {
      flex: 1; height: 5px; border-radius: 99px;
      background: #1e2230; cursor: pointer; position: relative;
      transition: height .15s;
    }
    #progress-track:hover { height: 8px; }
    #progress-bar {
      height: 100%; border-radius: 99px; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      pointer-events: none; position: relative;
    }
    #progress-bar::after {
      content: ''; position: absolute; right: -5px; top: 50%;
      transform: translateY(-50%);
      width: 11px; height: 11px; border-radius: 50%;
      background: #fff; opacity: 0;
      transition: opacity .15s;
    }
    #progress-track:hover #progress-bar::after { opacity: 1; }

    /* controls row */
    .controls-row { display: flex; align-items: center; gap: 10px; }
    .ctrl-btn {
      width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
      color: var(--text); transition: background .15s;
      flex-shrink: 0;
    }
    .ctrl-btn:hover { background: var(--border); }
    .ctrl-btn.primary {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent); color: #fff;
      transition: background .15s, transform .1s;
    }
    .ctrl-btn.primary:hover { background: #6ba3ff; transform: scale(1.05); }

    /* volume */
    .vol-group { display: flex; align-items: center; gap: 6px; }
    #vol-track {
      width: 72px; height: 4px; border-radius: 99px;
      background: #1e2230; cursor: pointer; position: relative;
    }
    #vol-bar {
      height: 100%; border-radius: 99px; width: 100%;
      background: var(--muted); pointer-events: none;
    }

    .ctrl-sep { flex: 1; }
    .speed-btn {
      font-size: .72rem; font-weight: 700; padding: 3px 8px;
      border-radius: 6px; background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); transition: background .15s, color .15s;
    }
    .speed-btn.active { background: rgba(79,142,247,.2); border-color: rgba(79,142,247,.4); color: var(--accent); }

    /* ── PRESENTER ── */
    #present-modal {
      position: fixed; inset: 0; z-index: 800;
      background: #000; display: none; flex-direction: column;
    }
    #present-modal.open { display: flex; }
    #present-toolbar {
      display: flex; align-items: center; gap: 10px; padding: 10px 18px;
      background: rgba(8,10,15,.96); border-bottom: 1px solid #111827; flex-shrink: 0;
    }
    #present-title { flex: 1; font-size: .84rem; font-weight: 600; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #present-page-info { font-size: .78rem; color: var(--muted); min-width: 72px; text-align: center; }
    .pbtn {
      padding: 5px 13px; border-radius: 8px; font-size: .77rem; font-weight: 600; border: 1px solid var(--border); transition: background .15s;
    }
    #btn-prev, #btn-next {
      padding: 5px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; transition: background .15s;
    }
    #btn-prev:hover, #btn-next:hover { background: var(--border); }
    #btn-prev:disabled, #btn-next:disabled { opacity: .3; cursor: not-allowed; }
    #btn-fullscreen-toggle { background: rgba(79,142,247,.13); border-color: rgba(79,142,247,.3); color: var(--accent); }
    #btn-fullscreen-toggle:hover { background: rgba(79,142,247,.25); }
    #btn-close-present { background: rgba(248,113,113,.12); border-color: rgba(248,113,113,.3); color: var(--danger); }
    #btn-close-present:hover { background: rgba(248,113,113,.25); }
    .kbd-hint { font-size: .68rem; color: var(--muted); background: var(--border); padding: 2px 6px; border-radius: 4px; font-family: var(--font-mono); }

    #slide-area { flex: 1; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; }
    #slide-canvas-wrapper { position: relative; box-shadow: 0 0 80px rgba(0,0,0,.9); }
    #slide-canvas { display: block; }
    #slide-loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.7); font-size: .88rem; color: var(--muted); gap: 10px;
    }
    #thumb-strip {
      display: flex; gap: 8px; padding: 9px 14px; overflow-x: auto;
      background: rgba(8,10,15,.96); border-top: 1px solid #111827; flex-shrink: 0;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .thumb-item {
      flex-shrink: 0; width: 76px; height: 54px; border-radius: 5px;
      overflow: hidden; cursor: pointer; border: 2px solid transparent;
      transition: border-color .15s; background: #1a1f2e;
    }
    .thumb-item.active { border-color: var(--accent); }
    .thumb-item canvas { width: 100%; height: 100%; object-fit: cover; }

    /* spinner */
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- ── TOPBAR ── -->
<div id="topbar">
  <span class="logo">☁ MyFiles</span>
  <div class="sep"></div>
  <div id="search-box">
    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search-input" placeholder="파일 검색…" />
  </div>
  <div class="view-toggle">
    <button id="btn-grid" class="active" title="그리드">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
    </button>
    <button id="btn-list" title="리스트">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
  </div>
</div>

<!-- ── MAIN ── -->
<div id="app">
  <!-- Drop zone -->
  <div id="drop-zone">
    <input type="file" id="file-input" multiple accept=".pdf,.md,.markdown,.mp4,.webm,.mov" />
    <div class="dz-icon">☁️</div>
    <p><strong>PDF · Markdown · MP4 파일을 드래그하거나 클릭하여 업로드</strong></p>
    <p style="margin-top:5px">파일은 브라우저 세션 동안만 유지됩니다</p>
  </div>

  <!-- PDF -->
  <div class="section-hdr">
    <h2>PDF 파일</h2>
    <span class="badge badge-pdf" id="pdf-count">0</span>
  </div>
  <div class="file-grid" id="pdf-grid">
    <div class="empty-state">아직 PDF 파일이 없습니다</div>
  </div>

  <!-- MP4 -->
  <div class="section-hdr">
    <h2>동영상 파일</h2>
    <span class="badge badge-mp4" id="mp4-count">0</span>
  </div>
  <div class="file-grid" id="mp4-grid">
    <div class="empty-state">아직 동영상 파일이 없습니다</div>
  </div>

  <!-- Markdown -->
  <div class="section-hdr">
    <h2>Markdown 파일</h2>
    <span class="badge badge-md" id="md-count">0</span>
  </div>
  <div class="file-grid" id="md-grid">
    <div class="empty-state">아직 Markdown 파일이 없습니다</div>
  </div>
</div>

<!-- ── MD VIEWER MODAL ── -->
<div class="modal-overlay" id="md-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span>📝</span>
      <h3 id="md-modal-title"></h3>
      <button id="btn-close-md">✕</button>
    </div>
    <div class="modal-body">
      <div class="md-content" id="md-content"></div>
    </div>
  </div>
</div>

<!-- ── VIDEO PLAYER MODAL ── -->
<div id="video-modal">
  <div id="video-topbar">
    <span style="font-size:1rem">🎬</span>
    <span id="video-title">동영상</span>
    <div class="sep"></div>
    <button class="vbtn" id="btn-vfull">⛶ 전체화면</button>
    <button class="vbtn" id="btn-vclose">✕ 닫기</button>
  </div>
  <div id="video-area">
    <video id="video-el" preload="metadata"></video>
  </div>
  <!-- Custom controls -->
  <div id="video-controls">

          <svg id="icon-mute" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>

      <button class="speed-btn active" data-speed="1">1×</button>
      <button class="speed-btn" data-speed="1.5">1.5×</button>
      <button class="speed-btn" data-speed="2">2×</button>
      <!-- Fullscreen -->
      <button class="ctrl-btn" id="btn-vfull2" title="전체화면">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ── PRESENTER ── -->
<div id="present-modal">
  <div id="present-toolbar">
    <span id="present-title">발표</span>
    <button id="btn-prev">◀</button>
    <span id="present-page-info">1 / 1</span>
    <button id="btn-next">▶</button>
    <span class="kbd-hint">← →</span>
    <button class="pbtn" id="btn-fullscreen-toggle">⛶ 전체화면</button>
    <button class="pbtn" id="btn-close-present">✕ 닫기</button>
  </div>
  <div id="slide-area">
    <div id="slide-canvas-wrapper">
      <canvas id="slide-canvas"></canvas>
      <div id="slide-loading"><div class="spinner"></div><span>렌더링 중…</span></div>
    </div>
  </div>
  <div id="thumb-strip"></div>
</div>

<script>
// ── PDF.js worker ──
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── State ──
const state = {
  pdfFiles: [], mdFiles: [], mp4Files: [],
  viewMode: 'grid',
  pdfDoc: null, currentPage: 1, totalPages: 0,
};

// ── DOM ──
const pdfGrid    = document.getElementById('pdf-grid');
const mdGrid     = document.getElementById('md-grid');
const mp4Grid    = document.getElementById('mp4-grid');
const pdfCountEl = document.getElementById('pdf-count');
const mdCountEl  = document.getElementById('md-count');
const mp4CountEl = document.getElementById('mp4-count');
const searchInput= document.getElementById('search-input');
const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const btnGridV   = document.getElementById('btn-grid');
const btnListV   = document.getElementById('btn-list');

// MD modal
const mdModal    = document.getElementById('md-modal');
const mdModalTitle= document.getElementById('md-modal-title');
const mdContent  = document.getElementById('md-content');

// Video modal
const videoModal = document.getElementById('video-modal');
const videoTitle = document.getElementById('video-title');
const videoEl    = document.getElementById('video-el');
const progressBar= document.getElementById('progress-bar');
const progressTrack= document.getElementById('progress-track');
const timeCurrent= document.getElementById('time-current');
const timeTotal  = document.getElementById('time-total');
const volBar     = document.getElementById('vol-bar');
const volTrack   = document.getElementById('vol-track');
const iconPlay   = document.getElementById('icon-play');
const iconPause  = document.getElementById('icon-pause');
const iconVol    = document.getElementById('icon-vol');
const iconMute   = document.getElementById('icon-mute');

// Presenter
const presentModal  = document.getElementById('present-modal');
const presentTitle  = document.getElementById('present-title');
const presentPageInfo= document.getElementById('present-page-info');
const slideCanvas   = document.getElementById('slide-canvas');
const slideLoading  = document.getElementById('slide-loading');
const thumbStrip    = document.getElementById('thumb-strip');
const btnPrev       = document.getElementById('btn-prev');
const btnNext       = document.getElementById('btn-next');
const btnFull       = document.getElementById('btn-fullscreen-toggle');
const btnClosePresent= document.getElementById('btn-close-present');

// ── Helpers ──
function fmt(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}
function fmtTime(s) {
  if (isNaN(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m + ':' + String(sec).padStart(2,'0');
}

// ── marked config ──
marked.setOptions({
  highlight: (code, lang) => {
    if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
    return hljs.highlightAuto(code).value;
  },
  breaks: true, gfm: true,
});

// ── Drop / File input ──
fileInput.addEventListener('change', e => handleFiles(e.target.files));
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });

async function handleFiles(files) {
  for (const file of files) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'pdf') await addPdf(file);
    else if (ext === 'md' || ext === 'markdown') await addMd(file);
    else if (['mp4','webm','mov'].includes(ext)) await addMp4(file);
  }
  render();
}

async function addPdf(file) {
  if (state.pdfFiles.find(f => f.name === file.name)) return;
  const url = URL.createObjectURL(file);
  const doc = await pdfjsLib.getDocument(url).promise;
  const thumbUrl = await renderThumb(doc, 1);
  state.pdfFiles.push({ name: file.name, size: file.size, file, url, doc, thumbUrl });
}
async function addMd(file) {
  if (state.mdFiles.find(f => f.name === file.name)) return;
  const content = await file.text();
  state.mdFiles.push({ name: file.name, size: file.size, file, content });
}
async function addMp4(file) {
  if (state.mp4Files.find(f => f.name === file.name)) return;
  const url = URL.createObjectURL(file);
  // generate thumbnail via canvas
  const thumbUrl = await generateVideoThumb(url);
  state.mp4Files.push({ name: file.name, size: file.size, file, url, thumbUrl });
}

function generateVideoThumb(url) {
  return new Promise(resolve => {
    const v = document.createElement('video');
    v.src = url; v.muted = true; v.preload = 'metadata';
    v.addEventListener('loadeddata', () => {
      v.currentTime = Math.min(2, v.duration * 0.1);
    });
    v.addEventListener('seeked', () => {
      const c = document.createElement('canvas');
      c.width = 320; c.height = 180;
      c.getContext('2d').drawImage(v, 0, 0, 320, 180);
      resolve(c.toDataURL());
    });
    v.addEventListener('error', () => resolve(null));
    v.load();
  });
}

async function renderThumb(doc, pageNum) {
  const page = await doc.getPage(pageNum);
  const vp = page.getViewport({ scale: .35 });
  const canvas = document.createElement('canvas');
  canvas.width = vp.width; canvas.height = vp.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  return canvas.toDataURL();
}

// ── View toggle ──
btnGridV.addEventListener('click', () => { state.viewMode = 'grid'; btnGridV.classList.add('active'); btnListV.classList.remove('active'); render(); });
btnListV.addEventListener('click', () => { state.viewMode = 'list'; btnListV.classList.add('active'); btnGridV.classList.remove('active'); render(); });
searchInput.addEventListener('input', render);

// ── Render ──
function render() {
  const q = searchInput.value.toLowerCase();
  const pdfs = state.pdfFiles.filter(f => f.name.toLowerCase().includes(q));
  const mds  = state.mdFiles.filter(f => f.name.toLowerCase().includes(q));
  const mp4s = state.mp4Files.filter(f => f.name.toLowerCase().includes(q));

  pdfCountEl.textContent = pdfs.length;
  mdCountEl.textContent  = mds.length;
  mp4CountEl.textContent = mp4s.length;

  const lv = state.viewMode === 'list';
  [pdfGrid, mdGrid, mp4Grid].forEach(g => g.classList.toggle('list-view', lv));

  renderSection(pdfGrid, pdfs, f => makePdfCard(f, lv), 'PDF 파일이 없습니다');
  renderSection(mp4Grid, mp4s, f => makeMp4Card(f, lv), '동영상 파일이 없습니다');
  renderSection(mdGrid,  mds,  f => makeMdCard(f, lv),  'Markdown 파일이 없습니다');
}

function renderSection(grid, files, cardFn, emptyMsg) {
  grid.innerHTML = '';
  if (files.length === 0) {
    grid.innerHTML = `<div class="empty-state">아직 ${emptyMsg}</div>`;
  } else {
    files.forEach(f => grid.appendChild(cardFn(f)));
  }
}

// ── PDF card ──
function makePdfCard(f, lv) {
  const card = document.createElement('div');
  card.className = 'file-card pdf-card';
  const thumbDiv = document.createElement('div');
  thumbDiv.className = 'file-thumb';
  if (f.thumbUrl) {
    const img = new Image(); img.src = f.thumbUrl;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:4px;';
    thumbDiv.appendChild(img);
  } else { thumbDiv.textContent = 'PDF'; }

  card.innerHTML = `
    <span class="file-icon">📄</span>
    <div class="file-info">
      <div class="file-name" title="${f.name}">${f.name}</div>
      <div class="file-meta">
        <span style="color:var(--danger);font-weight:700">PDF</span>
        <span>${fmt(f.size)}</span>
        <span>${f.doc.numPages}p</span>
      </div>
    </div>
    <div class="file-actions">
      <button class="btn-sm btn-present">▶ 발표</button>
      <button class="btn-sm btn-delete">🗑</button>
    </div>`;
  if (!lv) card.querySelector('.file-icon').insertAdjacentElement('afterend', thumbDiv);

  card.querySelector('.btn-present').addEventListener('click', e => { e.stopPropagation(); openPresenter(f); });
  card.querySelector('.btn-delete').addEventListener('click', e => { e.stopPropagation(); state.pdfFiles = state.pdfFiles.filter(x=>x!==f); render(); });
  card.addEventListener('click', () => openPresenter(f));
  return card;
}

// ── MP4 card ──
function makeMp4Card(f, lv) {
  const card = document.createElement('div');
  card.className = 'file-card mp4-card';
  const thumbDiv = document.createElement('div');
  thumbDiv.className = 'file-thumb';
  if (f.thumbUrl) {
    const img = new Image(); img.src = f.thumbUrl;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:4px;';
    thumbDiv.appendChild(img);
    const overlay = document.createElement('div');
    overlay.className = 'video-play-overlay';
    overlay.innerHTML = `<div class="play-circle"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="#333"><polygon points="5,3 19,12 5,21"/></svg></div>`;
    thumbDiv.appendChild(overlay);
  } else {
    thumbDiv.innerHTML = `<div class="video-play-overlay" style="background:rgba(0,0,0,.4)"><div class="play-circle"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="#333"><polygon points="5,3 19,12 5,21"/></svg></div></div>`;
  }

  card.innerHTML = `
    <span class="file-icon">🎬</span>
    <div class="file-info">
      <div class="file-name" title="${f.name}">${f.name}</div>
      <div class="file-meta">
        <span style="color:var(--green);font-weight:700">VIDEO</span>
        <span>${fmt(f.size)}</span>
      </div>
    </div>
    <div class="file-actions">
      <button class="btn-sm btn-play">▶ 재생</button>
      <button class="btn-sm btn-delete">🗑</button>
    </div>`;
  if (!lv) card.querySelector('.file-icon').insertAdjacentElement('afterend', thumbDiv);

  card.querySelector('.btn-play').addEventListener('click', e => { e.stopPropagation(); openVideo(f); });
  card.querySelector('.btn-delete').addEventListener('click', e => { e.stopPropagation(); state.mp4Files = state.mp4Files.filter(x=>x!==f); render(); });
  card.addEventListener('click', () => openVideo(f));
  return card;
}

// ── MD card ──
function makeMdCard(f, lv) {
  const card = document.createElement('div');
  card.className = 'file-card md-card';
  card.innerHTML = `
    <span class="file-icon">📝</span>
    <div class="file-info">
      <div class="file-name" title="${f.name}">${f.name}</div>
      <div class="file-meta">
        <span style="color:var(--accent2);font-weight:700">MD</span>
        <span>${fmt(f.size)}</span>
      </div>
    </div>
    <div class="file-actions">
      <button class="btn-sm btn-view">👁 열기</button>
      <button class="btn-sm btn-delete">🗑</button>
    </div>`;
  card.querySelector('.btn-view').addEventListener('click', e => { e.stopPropagation(); openMd(f); });
  card.querySelector('.btn-delete').addEventListener('click', e => { e.stopPropagation(); state.mdFiles = state.mdFiles.filter(x=>x!==f); render(); });
  card.addEventListener('click', () => openMd(f));
  return card;
}

// ── MD Viewer ──
function openMd(f) {
  mdModalTitle.textContent = f.name;
  mdContent.innerHTML = marked.parse(f.content);
  mdContent.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
  mdModal.classList.add('open');
}
document.getElementById('btn-close-md').addEventListener('click', () => mdModal.classList.remove('open'));
mdModal.addEventListener('click', e => { if (e.target === mdModal) mdModal.classList.remove('open'); });

// ── Video Player ──────────────────────────────────────────────
function openVideo(f) {
  videoTitle.textContent = f.name;
  videoEl.src = f.url;
  videoModal.classList.add('open');
  document.body.style.overflow = 'hidden';
  videoEl.play().catch(()=>{});
}

function closeVideo() {
  videoEl.pause();
  videoEl.src = '';
  videoModal.classList.remove('open');
  document.body.style.overflow = '';
  if (document.fullscreenElement) document.exitFullscreen();
}

document.getElementById('btn-vclose').addEventListener('click', closeVideo);

// Play / Pause
document.getElementById('btn-play-pause').addEventListener('click', () => {
  if (videoEl.paused) videoEl.play(); else videoEl.pause();
});
videoEl.addEventListener('play',  () => { iconPlay.style.display='none'; iconPause.style.display=''; });
videoEl.addEventListener('pause', () => { iconPlay.style.display=''; iconPause.style.display='none'; });

// Seek
videoEl.addEventListener('timeupdate', () => {
  if (!videoEl.duration) return;
  const pct = videoEl.currentTime / videoEl.duration * 100;
  progressBar.style.width = pct + '%';
  timeCurrent.textContent = fmtTime(videoEl.currentTime);
});
videoEl.addEventListener('loadedmetadata', () => {
  timeTotal.textContent = fmtTime(videoEl.duration);
});
progressTrack.addEventListener('click', e => {
  const rect = progressTrack.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  videoEl.currentTime = pct * videoEl.duration;
});
// drag seek
let seekDragging = false;
progressTrack.addEventListener('mousedown', e => {
  seekDragging = true;
  doSeek(e);
});
document.addEventListener('mousemove', e => { if (seekDragging) doSeek(e); });
document.addEventListener('mouseup', () => { seekDragging = false; });
function doSeek(e) {
  const rect = progressTrack.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  videoEl.currentTime = pct * (videoEl.duration || 0);
}

// Touch seek
progressTrack.addEventListener('touchstart', e => { e.preventDefault(); doSeekTouch(e); }, { passive: false });
progressTrack.addEventListener('touchmove',  e => { e.preventDefault(); doSeekTouch(e); }, { passive: false });
function doSeekTouch(e) {
  const rect = progressTrack.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.touches[0].clientX - rect.left) / rect.width));
  videoEl.currentTime = pct * (videoEl.duration || 0);
}

// Rewind / Forward
document.getElementById('btn-rew').addEventListener('click', () => { videoEl.currentTime = Math.max(0, videoEl.currentTime - 10); });
document.getElementById('btn-fwd').addEventListener('click', () => { videoEl.currentTime = Math.min(videoEl.duration||0, videoEl.currentTime + 10); });

// Volume
volTrack.addEventListener('click', e => {
  const rect = volTrack.getBoundingClientRect();
  const vol = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  videoEl.volume = vol;
  videoEl.muted = vol === 0;
  updateVolUI(vol);
});
document.getElementById('btn-mute').addEventListener('click', () => {
  videoEl.muted = !videoEl.muted;
  updateVolUI(videoEl.muted ? 0 : videoEl.volume);
});
videoEl.addEventListener('volumechange', () => {
  updateVolUI(videoEl.muted ? 0 : videoEl.volume);
});
function updateVolUI(vol) {
  volBar.style.width = (vol * 100) + '%';
  if (vol === 0) { iconVol.style.display='none'; iconMute.style.display=''; }
  else { iconVol.style.display=''; iconMute.style.display='none'; }
}
updateVolUI(1);

// Speed
document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    videoEl.playbackRate = parseFloat(btn.dataset.speed);
  });
});

// Fullscreen (video)
function toggleVideoFull() {
  if (!document.fullscreenElement) {
    videoModal.requestFullscreen();
    document.getElementById('btn-vfull').textContent = '⛶ 전체화면 해제';
  } else {
    document.exitFullscreen();
    document.getElementById('btn-vfull').textContent = '⛶ 전체화면';
  }
}
document.getElementById('btn-vfull').addEventListener('click', toggleVideoFull);
document.getElementById('btn-vfull2').addEventListener('click', toggleVideoFull);

// Keyboard for video
document.addEventListener('keydown', e => {
  if (!videoModal.classList.contains('open')) return;
  if (e.key === ' ') { e.preventDefault(); if (videoEl.paused) videoEl.play(); else videoEl.pause(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); videoEl.currentTime = Math.min(videoEl.duration||0, videoEl.currentTime+5); }
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); videoEl.currentTime = Math.max(0, videoEl.currentTime-5); }
  else if (e.key === 'ArrowUp')    { e.preventDefault(); videoEl.volume = Math.min(1, videoEl.volume+.1); updateVolUI(videoEl.volume); }
  else if (e.key === 'ArrowDown')  { e.preventDefault(); videoEl.volume = Math.max(0, videoEl.volume-.1); updateVolUI(videoEl.volume); }
  else if (e.key === 'm' || e.key === 'M') { videoEl.muted=!videoEl.muted; updateVolUI(videoEl.muted?0:videoEl.volume); }
  else if (e.key === 'f' || e.key === 'F') toggleVideoFull();
  else if (e.key === 'Escape') closeVideo();
});

// ── Presenter ─────────────────────────────────────────────────
async function openPresenter(f) {
  state.pdfDoc = f.doc;
  state.totalPages = f.doc.numPages;
  state.currentPage = 1;
  presentTitle.textContent = f.name;
  presentModal.classList.add('open');
  document.body.style.overflow = 'hidden';
  await buildThumbs();
  await renderSlide(1);
}

async function buildThumbs() {
  thumbStrip.innerHTML = '';
  for (let i = 1; i <= state.totalPages; i++) {
    const item = document.createElement('div');
    item.className = 'thumb-item'; item.dataset.page = i;
    const c = document.createElement('canvas');
    item.appendChild(c); thumbStrip.appendChild(item);
    (async (page, canvas, el) => {
      const pg = await state.pdfDoc.getPage(page);
      const vp = pg.getViewport({ scale: .2 });
      canvas.width = vp.width; canvas.height = vp.height;
      await pg.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      el.addEventListener('click', () => gotoPage(page));
    })(i, c, item);
  }
}

async function renderSlide(pageNum) {
  slideLoading.style.display = 'flex';
  state.currentPage = pageNum;
  presentPageInfo.textContent = `${pageNum} / ${state.totalPages}`;
  btnPrev.disabled = pageNum <= 1;
  btnNext.disabled = pageNum >= state.totalPages;
  thumbStrip.querySelectorAll('.thumb-item').forEach(el => el.classList.toggle('active', Number(el.dataset.page) === pageNum));
  const activeThumb = thumbStrip.querySelector('.thumb-item.active');
  if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

  const page = await state.pdfDoc.getPage(pageNum);
  const area = document.getElementById('slide-area');
  const vp0  = page.getViewport({ scale: 1 });
  const scale = Math.min((area.clientWidth-40)/vp0.width, (area.clientHeight-40)/vp0.height, 2);
  const vp = page.getViewport({ scale });
  slideCanvas.width = vp.width; slideCanvas.height = vp.height;
  await page.render({ canvasContext: slideCanvas.getContext('2d'), viewport: vp }).promise;
  slideLoading.style.display = 'none';
}

function gotoPage(n) { if (n>=1 && n<=state.totalPages) renderSlide(n); }
btnPrev.addEventListener('click', () => gotoPage(state.currentPage - 1));
btnNext.addEventListener('click', () => gotoPage(state.currentPage + 1));

btnClosePresent.addEventListener('click', () => {
  presentModal.classList.remove('open');
  document.body.style.overflow = '';
  if (document.fullscreenElement) document.exitFullscreen();
});
btnFull.addEventListener('click', () => {
  if (!document.fullscreenElement) { presentModal.requestFullscreen(); btnFull.textContent = '⛶ 전체화면 해제'; }
  else { document.exitFullscreen(); btnFull.textContent = '⛶ 전체화면'; }
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) btnFull.textContent = '⛶ 전체화면';
  if (state.pdfDoc && presentModal.classList.contains('open')) setTimeout(() => renderSlide(state.currentPage), 100);
});

// Keyboard for presenter
document.addEventListener('keydown', e => {
  if (!presentModal.classList.contains('open')) return;
  if (['ArrowRight','ArrowDown',' '].includes(e.key)) { e.preventDefault(); gotoPage(state.currentPage+1); }
  else if (['ArrowLeft','ArrowUp'].includes(e.key)) { e.preventDefault(); gotoPage(state.currentPage-1); }
  else if (e.key==='Escape') btnClosePresent.click();
  else if (e.key==='f'||e.key==='F') btnFull.click();
});

// Swipe (presenter)
let pTouchX = 0;
document.getElementById('slide-area').addEventListener('touchstart', e => { pTouchX = e.touches[0].clientX; }, { passive: true });
document.getElementById('slide-area').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - pTouchX;
  if (Math.abs(dx) > 50) { dx<0 ? gotoPage(state.currentPage+1) : gotoPage(state.currentPage-1); }
});

window.addEventListener('resize', () => {
  if (state.pdfDoc && presentModal.classList.contains('open')) renderSlide(state.currentPage);
});

render();
</script>
</body>
</html>
